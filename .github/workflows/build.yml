name: Build APK

# Builds an installable debug APK in the cloud and publishes it to a GitHub
# Release, so it can be downloaded and installed straight onto an Android phone
# without needing a computer.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Automated build failure report for commit \`${GITHUB_SHA}\`."
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo '```'
            if [ -f build.log ]; then
              # Keep only the most relevant tail of the Gradle output.
              grep -nE "error:|e: |FAILED|What went wrong|Caused by|Unresolved|> Task|BUILD" build.log | tail -n 120
              echo "----- last 200 lines -----"
              tail -n 200 build.log
            else
              echo "build.log not found - failure happened before the Gradle step."
            fi
            echo '```'
          } > issue_body.md
          gh issue create \
            --title "CI build failure (run ${GITHUB_RUN_ID})" \
            --body-file issue_body.md \
            --label "ci-failure" 2>/dev/null \
          || gh issue create \
            --title "CI build failure (run ${GITHUB_RUN_ID})" \
            --body-file issue_body.md

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Azar-prueba.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azar-prueba-apk
          path: dist/Azar-prueba.apk

      - name: Publish APK to a Release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba
          name: "Azar — versión de prueba (instalable)"
          body: |
            APK de prueba listo para instalar en Android (mínimo Android 8.0).

            **Cómo instalar desde el móvil:**
            1. Descarga `Azar-prueba.apk` desde abajo (sección *Assets*).
            2. Ábrelo. Si Android avisa, permite "instalar apps de esta fuente".
            3. ¡Listo! Verás anuncios de PRUEBA (no generan dinero todavía).

            Se actualiza automáticamente en cada cambio del código.
          files: dist/Azar-prueba.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
